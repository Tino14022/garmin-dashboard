name: Rebuild and deploy dashboard

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The suite needs no Garmin credentials and no network — it drives the
      # whole pipeline through a fake source.
      - name: Run tests
        run: uv run --with pytest --with tzdata python -m pytest tests/ -q

  build-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Restore Garmin tokens from secret
        run: |
          mkdir -p ~/.garminconnect
          echo "${{ secrets.GARMIN_TOKENS_B64 }}" | base64 -d > ~/.garminconnect/garmin_tokens.json

      - name: Build dashboard
        run: uv run dashboard.py

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp manifest.json _site/
          cp -r icons _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
