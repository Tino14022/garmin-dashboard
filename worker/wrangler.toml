name = "garmin-dashboard-logger"
main = "index.js"
compatibility_date = "2024-11-01"

[vars]
# Repo the Worker commits to, and the branch Pages builds from.
GITHUB_REPO = "Tino14022/garmin-dashboard"
GITHUB_BRANCH = "master"
# Restrict which site may call this. "*" would let any page that learns the app
# token post on your behalf.
ALLOWED_ORIGIN = "https://tino14022.github.io"

# GITHUB_TOKEN and APP_TOKEN are secrets, never vars — see README.md.
